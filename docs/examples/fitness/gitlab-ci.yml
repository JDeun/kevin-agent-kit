# NOT A TRUSTED GATE ON ITS OWN. Merge request pipelines read this file from the candidate's
# own project, so a candidate can edit it. It is a trusted gate only when the approved definition
# is enforced from outside the candidate (for example a pipeline execution or compliance policy
# that your GitLab tier provides, with the runner image pinned). Without one, treat it as
# advisory feedback.
architecture-fitness:
  # The referenced runner image supplies the approved kit on PATH.
  image: $FITNESS_RUNNER_IMAGE
  variables:
    GIT_DEPTH: "0"
  rules:
    # Only merged-result pipelines check the integration and carry the target SHA.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_EVENT_TYPE == "merged_result"'
  script:
    - |
      if [ "$CI_PROJECT_ID" = "$CI_MERGE_REQUEST_PROJECT_ID" ]; then
        target_remote=origin
      else
        target_remote="$CI_MERGE_REQUEST_PROJECT_URL.git"
      fi
      git fetch --no-tags -- "$target_remote" "refs/heads/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
      target_sha="${CI_MERGE_REQUEST_TARGET_BRANCH_SHA:?merged-result pipelines provide the target SHA}"
      kevin-agent-kit fitness check --config fitness.toml --policy-from-target \
        --baseline fitness-baseline.json --target "$target_sha"
