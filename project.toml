[project]
name = "kevin-agent-kit"
version = "0.3.3"

[loop]
repo = ""
target = "main"
max_rounds = 5
design_gate = true
trust = "signed"
review_format = "receipt"
repeat_class_rounds = 2
wiki_landing = true
wiki_dir = "docs/research"
max_jobs = 2
poll_seconds = 2
timeout_seconds = 900
retry_initial_seconds = 15
retry_limit = 6
retry_max_seconds = 300
evidence_ttl_seconds = 3600
max_model = "default"
models = ["default"]
reviewer_model = "default"
worker_model = "default"
reviewer = []
review_observer = []
review_key = ""
worker = []
repair_paths = []

[loop.checks]

[loop.check_commands]

[loop.check_keys]

[loop.evidence]

[loop.lens_reviewers]

[loop.execution]

[loop.memory.review]
max_anon_mib = 0
min_available_mib = 0

[loop.memory.test]
max_anon_mib = 0
min_available_mib = 0

[loop.lenses]
db = ["**/migrations/**", "**/*.sql"]
